<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- علامة إثبات ملكية جوجل Search Console -->
  <meta name="google-site-verification" content="s6GwQsjyQhOpNg" />

  <title>منصة الفيديوهات الحصرية</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    header {
      margin-bottom: 30px;
    }
    .admin-btn {
      background-color: #238636;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .admin-btn:hover {
      background-color: #2ea043;
    }
    .upload-box {
      background-color: #161b22;
      border: 1px solid #30363d;
      padding: 20px;
      border-radius: 10px;
      max-width: 450px;
      margin: 20px auto;
      display: none;
    }
    input[type="file"] {
      margin: 15px 0;
      color: #8b949e;
    }
    .upload-btn {
      background-color: #0070f3;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }
    .status-text {
      margin-top: 10px;
      font-size: 14px;
      color: #58a6ff;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 30px auto;
    }
    video {
      width: 100%;
      border-radius: 8px;
      background-color: #000;
    }
  </style>
</head>
<body>

  <header>
    <h1>منصة الفيديوهات</h1>
    <button class="admin-btn" onclick="checkAdmin()">لوحة رفع فيديو جديد 🔒</button>
  </header>

  <!-- صندوق الرفع الخاص بصاحب الموقع -->
  <div id="uploadBox" class="upload-box">
    <h3>رفع فيديو جديد</h3>
    <input type="file" id="videoFile" accept="video/*">
    <button class="upload-btn" onclick="uploadVideo()">رفع الفيديو الآن 🚀</button>
    <div id="status" class="status-text"></div>
  </div>

  <!-- عرض الفيديوهات المرفوعة -->
  <div class="video-grid" id="videoList">
    <!-- ستظهر الفيديوهات هنا تلقائياً -->
  </div>

  <script>
    const CLOUD_NAME = "qozd1q6ri"; 
    const UPLOAD_PRESET = "xnxx.com"; 
    const ADMIN_PASSWORD = "2612006";

    function checkAdmin() {
      const pass = prompt("أدخل كلمة السر الخاصة بصاحب الموقع:");
      if (pass === ADMIN_PASSWORD) {
        document.getElementById('uploadBox').style.display = 'block';
      } else if (pass !== null) {
        alert("كلمة السر غير صحيحة!");
      }
    }

    async function uploadVideo() {
      const fileInput = document.getElementById('videoFile');
      const status = document.getElementById('status');
      
      if (!fileInput.files[0]) {
        alert("برجاء اختيار ملف فيديو أولاً");
        return;
      }

      status.innerText = "جاري رفع الفيديو... يرجى الانتظار";

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      formData.append('upload_preset', UPLOAD_PRESET);

      try {
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
          method: 'POST',
          body: formData
        });
        
        const data = await res.json();

        if (data.secure_url) {
          status.innerText = "تم رفع الفيديو بنجاح! 🎉";
          addVideoToPage(data.secure_url);
          fileInput.value = "";
        } else {
          console.error(data);
          status.innerText = "فشل الرفع: " + (data.error ? data.error.message : "حدث خطأ غير متوقع");
        }
      } catch (err) {
        status.innerText = "حدث خطأ أثناء الاتصال بالشبكة!";
      }
    }

    function addVideoToPage(url) {
      const videoList = document.getElementById('videoList');
      const videoCard = document.createElement('div');
      videoCard.innerHTML = `<video src="${url}" controls preload="metadata"></video>`;
      videoList.prepend(videoCard);
    }
  </script>

</body>
</html>
