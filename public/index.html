<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>منصة الفيديوهات</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: white; padding: 20px; text-align: center; }
    .upload-box { background: #1e1e1e; padding: 20px; border-radius: 10px; max-width: 500px; margin: 20px auto; display: none; }
    input, button { padding: 10px; margin: 10px 0; width: 80%; border-radius: 5px; border: none; }
    button { background: #0070f3; color: white; cursor: pointer; font-weight: bold; }
    .video-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
    video { width: 100%; max-width: 400px; border-radius: 10px; }
  </style>
</head>
<body>

  <h1>موقع الفيديوهات الخاص بي</h1>

  <!-- زر مخفي لدخول صاحب الموقع -->
  <button onclick="checkAdmin()">لوحة رفع فيديو جديد 🔒</button>

  <!-- نموذج الرفع المباشر -->
  <div id="uploadBox" class="upload-box">
    <h3>رفع فيديو جديد</h3>
    <input type="file" id="videoFile" accept="video/*">
    <button onclick="uploadVideo()">رفع الفيديو الآن 🚀</button>
    <p id="status"></p>
  </div>

  <!-- مكان عرض الفيديوهات -->
  <div class="video-container" id="videoList">
    <!-- ستظهر الفيديوهات المرفوعة هنا -->
  </div>

  <script>
    // اكتب بياناتك من حساب Cloudinary هنا
    const CLOUD_NAME = "qozdlq6n"; 
    const UPLOAD_PRESET = "xnxx.com"; 
    const ADMIN_PASSWORD = "2612006"; // كلمة السر الخاصة بك لدخول لوحة الرفع

    function checkAdmin() {
      const pass = prompt("أدخل كلمة السر الخاصة بصاحب الموقع:");
      if (pass === ADMIN_PASSWORD) {
        document.getElementById('uploadBox').style.display = 'block';
      } else {
        alert("كلمة السر غير صحيحة!");
      }
    }

    async function uploadVideo() {
      const fileInput = document.getElementById('videoFile');
      const status = document.getElementById('status');
      
      if (!fileInput.files[0]) {
        alert("برجاء اختيار فيديو أولاً");
        return;
      }

      status.innerText = "جاري رفع الفيديو... يرجى الانتظار";

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      formData.append('upload_preset', UPLOAD_PRESET);

      try {
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
          method: 'POST',
          body: formData
        });
        const data = await res.json();

        if (data.secure_url) {
          status.innerText = "تم رفع الفيديو بنجاح! 🎉";
          addVideoToPage(data.secure_url);
        } else {
          status.innerText = "حدث خطأ أثناء الرفع!";
        }
      } catch (err) {
        status.innerText = "فشل الاتصال بالخادم!";
      }
    }

    function addVideoToPage(url) {
      const videoList = document.getElementById('videoList');
      const videoTag = document.createElement('video');
      videoTag.src = url;
      videoTag.controls = true;
      videoList.appendChild(videoTag);
    }
  </script>
</body>
</html>
